# Masaüstü sürümü: "v1.0.0-rc.1" gibi bir etiket (tag) gönderilince macOS ve Windows paketlerini derler
# ve GitHub Releases'a yükler. Etiket "-rc", "-beta" ya da "-alpha" içeriyorsa sürüm "pre-release" işaretlenir.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Varsayılan: salt okunur. Yazma izni yalnızca release'e yükleyen işte.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # GitHub Release'e yükleme için
    timeout-minutes: 60 # takılan bir derleme 6 saat (varsayılan) çalışmasın; kuyrukta bekleme süreye sayılmaz
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      # Üçüncü taraf action'lar commit SHA'sına sabit (etiket sonradan değiştirilse de aynı kod çalışır)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # derleme adımları jetonu git ayarında görmesin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Derle ve paketle
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # İmzalama için (sertifika alındığında açın):
          # CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # İmzalama sertifikaları eklenince bu satırı silin:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: GitHub Release'e yükle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
